<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"><link rel="stylesheet" href="{{css}}"><title>Harness Session Manager</title></head><body><main class="sidebar-content">
<section class="account"><div class="section-heading"><button id="account-toggle" class="section-toggle" aria-expanded="false"><span class="chevron">›</span> ACCOUNT &amp; USAGE</button><button id="check-release" type="button" class="extension-version" title="Проверить обновления Harness" aria-label="Проверить обновления Harness, версия {{version}}">v{{version}}</button></div><div id="release-check-status" role="status"></div><div id="account-content" hidden><div id="provider" class="provider"></div><div id="meters"></div></div></section>
<section class="manager"><div class="section-heading"><button id="manager-toggle" class="section-toggle" aria-expanded="true"><span class="chevron expanded">›</span> SESSION MANAGER</button></div><div id="manager-content"><button id="new" class="new-session"><span class="plus" id="new-icon"></span> New session</button><div class="filters"><button id="active" class="active-filter" title="Show running or waiting sessions"><span id="active-icon"></span> Active · <span id="active-count">0</span></button><button id="search" class="icon" title="Search sessions" aria-label="Search sessions"></button><button id="group" class="new-group"><span id="group-icon"></span> New group</button></div><div id="search-box" hidden><input id="query" placeholder="Search sessions…" aria-label="Search sessions"></div><div id="sessions"></div><button id="archived" class="group-heading archived" aria-expanded="false"><span class="chevron">›</span> <span class="name">Archived sessions</span><span id="archived-count" class="count">0</span></button><div id="archived-sessions" hidden></div></div></section><div id="error" role="status" hidden></div>
</main>
<footer id="release-footer" hidden><button id="release-button" type="button">Обновиться</button><div id="release-error" role="status" hidden></div></footer>
<script nonce="{{nonce}}" src="{{icons}}"></script><script nonce="{{nonce}}" src="{{js}}"></script></body></html>
